name: Validate OGARD release

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: Retrieve the exact public source revision
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/ogard-source"
          cd "$RUNNER_TEMP/ogard-source"
          git init --quiet
          git remote add origin "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY.git"
          git fetch --quiet --depth=1 origin "$GITHUB_SHA"
          git checkout --quiet --detach FETCH_HEAD
      - name: Verify tests, outputs, links and release fingerprints
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/ogard-source"
          python3 --version
          python3 run_validation.py --output "$RUNNER_TEMP/ogard-validation" --verify-snapshot
